[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "salah-sdk"
version = "0.1.0"
description = "Unified Python client for GIS-flavored LLM calls (Gemini · Groq · OpenRouter)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ITI Gen AI students"}]
keywords = ["gis", "llm", "gemini", "groq", "openrouter", "qgis", "remote-sensing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "google-genai>=1.0",
    "groq>=0.11",
    "openai>=1.40",
    "pillow>=10.0",
    "requests>=2.31",
]

[project.optional-dependencies]
ui = ["streamlit>=1.32", "python-dotenv>=1.0"]

[project.urls]
Homepage = "https://github.com/iti-gen-ai/salah-sdk"

[tool.setuptools.packages.find]
include = ["salah_sdk*"]
exclude = ["pages*", "docs*", "tests*"]
